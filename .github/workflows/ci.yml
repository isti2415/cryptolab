name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Python samples shown on the site are held to the same vectors as the
      # TypeScript engines; both runners have to pass or a sample has drifted.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:python
      - run: pnpm build
      # Structured data is validated against the built HTML, so a broken
      # JSON-LD block fails the build rather than being noticed in Search Console.
      - run: pnpm validate:jsonld
