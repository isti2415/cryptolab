<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The brand mark drawn as geometry rather than the U+259A glyph the topbar
    uses. A <text> favicon depends on whatever monospace font the renderer
    happens to pick, which is not something a favicon should be gambling on.
  -->
  <rect width="64" height="64" rx="14" fill="#08090b"/>
  <rect x="16" y="14" width="14" height="20" rx="2" fill="#35e0d0"/>
  <rect x="34" y="30" width="14" height="20" rx="2" fill="#35e0d0"/>
</svg>
